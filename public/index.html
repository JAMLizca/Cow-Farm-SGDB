<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cow Farm SGDB</title>
  <link rel="icon" type="image/x-icon" href="img/Logo_SGDB.png">
 <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">

      <div class="login-logo">
        <img src="img/Logo_SGDB.png" alt="SGDB Logo">
      </div>

      <h1>Iniciar Sesión</h1>

      <div class="error-msg" id="error-msg"></div>

      <div class="form-group">
        <label>Código de Finca</label>
        <input type="text" id="codigo_finca" placeholder="Ingrese el código de la finca">
      </div>

      <div class="form-group">
        <label>Usuario</label>
        <input type="text" id="nombre" placeholder="Ingrese su usuario">
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="Ingrese su contraseña">
      </div>

      <button class="btn-login" id="btn-login">Ingresar</button>

      <a class="login-link" onclick="openRecovery()">¿Olvidaste tu contraseña?</a>

    </div>
  </div>

  <!-- MODAL RECUPERAR CONTRASEÑA -->
<div class="modal-overlay" id="modal-recovery" style="z-index:300;">
  <div class="modal" style="max-width:420px;">

    <!-- Solicitar -->
    <div id="recovery-step-1">
      <div class="modal-title">¿Olvidaste tu contraseña?</div>
      <p style="font-size:13px;color:var(--texto-suave);margin-bottom:20px;">
        Ingresa el código de tu finca y tu correo electrónico. Te enviaremos un enlace para restablecer tu contraseña.
      </p>
      <div class="error-msg" id="recovery-error"></div>
      <div class="form-group">
        <label>Código de Finca</label>
        <input type="text" id="recovery-finca" placeholder="Ej: FINCA001">
      </div>
      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" id="recovery-email" placeholder="tucorreo@ejemplo.com">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeRecovery()">Cancelar</button>
        <button class="btn-save" onclick="solicitarRecovery()">Enviar enlace</button>
      </div>
    </div>

    <!-- Éxito -->
    <div id="recovery-step-2" style="display:none;text-align:center;">
      <div style="font-size:52px;margin-bottom:12px;"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-mail-fast"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 7h3" /><path d="M3 11h2" /><path d="M9.02 8.801l-.6 6a2 2 0 0 0 1.99 2.199h7.98a2 2 0 0 0 1.99 -1.801l.6 -6a2 2 0 0 0 -1.99 -2.199h-7.98a2 2 0 0 0 -1.99 1.801" /><path d="M9.8 7.5l2.982 3.28a3 3 0 0 0 4.238 .202l3.28 -2.982" /></svg></div>
      <div class="modal-title">Correo enviado</div>
      <p style="font-size:13px;color:var(--texto-suave);margin:12px 0 24px;">
        Revisa tu bandeja de entrada. El enlace es válido por <strong>30 minutos</strong>.
      </p>
      <button class="btn-save" style="width:100%;justify-content:center;" onclick="closeRecovery()">
        Entendido
      </button>
    </div>

  </div>
</div>

  <script src="js/auth.js"></script>

</body>
</html>
