<!-- Tabla bovinos -->
<div class="card">
  <div class="section-header">
    <div>
      <div class="card-title">Sistema de Gestión de Bovinos</div>
      <div class="card-subtitle">Listado de Bovinos</div>
    </div>
    <button class="btn-primary" onclick="openFormBovino()">
      + Registrar Bovino
    </button>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Identificador</th>
          <th>Nombre</th>
          <th>Raza</th>
          <th>Estado de Salud</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-bovinos"></tbody>
    </table>
  </div>
</div>

<!-- Formulario bovino -->
<div class="card" id="form-bovino-card" style="display:none">
  <div class="card-title" id="form-bovino-title">Registrar Bovino</div>
  <div class="form-grid">
    <div class="form-group-inline">
      <label>Número de Identificación (Arete)</label>
      <input type="text" id="f-arete" placeholder="Ej: BOV-006">
    </div>
    <div class="form-group-inline">
      <label>Nombre</label>
      <input type="text" id="f-nombre" placeholder="Ej: Luna">
    </div>
    <div class="form-group-inline">
      <label>Sexo</label>
      <select id="f-sexo">
        <option value="">Seleccionar sexo</option>
        <option>Macho</option>
        <option>Hembra</option>
      </select>
    </div>
    <div class="form-group-inline">
      <label>Categoría</label>
      <select id="f-categoria">
        <option value="">Seleccionar categoría</option>
        <option>Toro</option>
        <option>Vaca</option>
        <option>Ternero</option>
        <option>Ternera</option>
        <option>Novillo</option>
        <option>Novilla</option>
        <option>Becerro</option>
      </select>
    </div>
    <div class="form-group-inline">
      <label>Raza</label>
      <select id="f-raza">
        <option value="">Seleccionar raza</option>
      </select>
    </div>
    <div class="form-group-inline">
      <label>Propósito</label>
      <select id="f-proposito">
        <option value="">Seleccionar propósito</option>
        <option>Carne</option>
        <option>Leche</option>
        <option>Doble propósito</option>
        <option>Cría</option>
      </select>
    </div>
    <div class="form-group-inline">
      <label>Fecha de Nacimiento</label>
      <input type="date" id="f-fecha">
    </div>
    <div class="form-group-inline">
      <label>Peso Inicial (kg)</label>
      <input type="number" id="f-peso" placeholder="Ej: 450">
    </div>
    <div class="form-group-inline">
      <label>Estado de Salud</label>
      <select id="f-estado">
        <option value="">Seleccionar estado</option>
        <option>Saludable</option>
        <option>En observación</option>
        <option>En tratamiento</option>
      </select>
    </div>
  </div>
  <div class="form-actions">
    <button class="btn-save" onclick="saveBovino()">Guardar</button>
    <button class="btn-cancel" onclick="cancelFormBovino()">Cancelar</button>
  </div>
</div>
