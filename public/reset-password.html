<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGDB - Restablecer Contraseña</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="shortcut icon" href="img/Logo_SGDB.png" type="image/x-icon">
</head>
<body>

  <!-- PANTALLA NUEVA CONTRASEÑA -->
  <div class="login-wrapper">
    <div class="login-card">

      <div class="login-logo">
        <img src="img/Logo_SGDB.png" alt="Logo">
      </div>

      <!-- PASO 1: Formulario nueva contraseña -->
      <div id="step-reset">
        <h1>Nueva Contraseña</h1>
        <p style="text-align:center;font-size:13px;color:var(--texto-suave);margin-bottom:24px;">
          Ingresa tu nueva contraseña para acceder al sistema.
        </p>

        <div class="error-msg" id="error-reset"></div>

        <div class="form-group">
          <label>Nueva Contraseña</label>
          <input type="password" id="new-password" placeholder="Mínimo 6 caracteres">
        </div>
        <div class="form-group">
          <label>Confirmar Contraseña</label>
          <input type="password" id="confirm-password" placeholder="Repite la contraseña">
        </div>
        <button class="btn-login" onclick="restablecerPassword()">
          Guardar nueva contraseña
        </button>
      </div>

      <!-- PASO 2: Éxito -->
      <div id="step-success" style="display:none;text-align:center;">
        <div style="font-size:60px;margin-bottom:16px;">✅</div>
        <h1 style="margin-bottom:12px;">Contraseña actualizada</h1>
        <p style="font-size:14px;color:var(--texto-suave);margin-bottom:28px;">
          Tu contraseña fue restablecida correctamente. Ya puedes iniciar sesión.
        </p>
        <button class="btn-login" onclick="window.location.href='index.html'">
          Ir al inicio de sesión
        </button>
      </div>

      <!-- PASO 3: Token inválido -->
      <div id="step-error" style="display:none;text-align:center;">
        <div style="font-size:60px;margin-bottom:16px;">❌</div>
        <h1 style="margin-bottom:12px;">Enlace inválido</h1>
        <p style="font-size:14px;color:var(--texto-suave);margin-bottom:28px;">
          El enlace ha expirado o es inválido. Solicita uno nuevo desde el login.
        </p>
        <button class="btn-login" onclick="window.location.href='index.html'">
          Volver al inicio
        </button>
      </div>

    </div>
  </div>

  <div class="toast" id="toast"></div>



</body>
<script src="js/reset-password.js"></script>
</html>
