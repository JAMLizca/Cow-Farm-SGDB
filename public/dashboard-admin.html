<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGDB — Dashboard Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .kpi-card {
      background: var(--blanco);
      border-radius: 12px;
      padding: 20px 24px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .kpi-value {
      font-size: 32px;
      font-weight: 900;
      color: var(--texto);
      line-height: 1;
      margin-bottom: 4px;
    }
    .kpi-label {
      font-size: 13px;
      color: var(--texto-suave);
      font-weight: 500;
    }
    .kpi-icon {
      width: 48px; height: 48px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .kpi-icon.green  { background: #e8f5ec; }
    .kpi-icon.yellow { background: #fef9e7; }
    .kpi-icon.red    { background: #fff5f5; }
    .rep-row-1 {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .rep-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .rep-card {
      background: var(--blanco);
      border-radius: 14px;
      padding: 24px;
      box-shadow: var(--shadow);
    }
    .rep-card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--texto);
      margin-bottom: 4px;
    }
    .rep-card-sub {
      font-size: 12px;
      color: var(--texto-suave);
      margin-bottom: 16px;
    }
    .rep-total {
      font-size: 12px;
      color: var(--verde);
      font-weight: 600;
    }
    .hato-number {
      font-size: 52px;
      font-weight: 900;
      color: var(--texto);
      text-align: center;
      margin: 20px 0 4px;
    }
    .hato-label {
      text-align: center;
      font-size: 13px;
      color: var(--texto-suave);
      margin-bottom: 20px;
    }
    .empty-sanitario {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: var(--texto-suave);
    }
    .empty-sanitario svg { margin-bottom: 12px; }
    .empty-sanitario p  { font-size: 14px; }
    .nav-logo-box {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--blanco);
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid rgba(255,255,255,0.2);
    }
    .nav-logo-box img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .loading-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: var(--texto-suave);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="navbar-brand">Dashboard Del Admin</div>
    <div class="nav-logo-box">
      <img src="img/Logo_SGDB.png" alt="Logo">
    </div>
  </nav>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-menu">

      <div class="sidebar-item active" onclick="showPanel('bovinos')" id="menu-bovinos">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>
        Bovinos
      </div>

      <div class="sidebar-item" onclick="showPanel('usuarios')" id="menu-usuarios">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Usuarios
      </div>

      <div class="sidebar-item" onclick="showPanel('sanitario')" id="menu-sanitario">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 2 4 4"/><path d="m17 7 3-3"/><path d="M19 9 8.7 19.3c-1 1-2.5 1-3.4 0l-.6-.6c-1-1-1-2.5 0-3.4L15 5"/><path d="m9 11 4 4"/></svg>
        Sanitario
      </div>

      <div class="sidebar-item" onclick="showPanel('reportes')" id="menu-reportes">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>
        Reportes
      </div>

    </div>
    <div class="sidebar-bottom">
      <div class="user-info">
        <div
